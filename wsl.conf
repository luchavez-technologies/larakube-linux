# Read by WSL when the distro starts. systemd runs k3s and Podman's user services; the larakube login is the
# default; Windows folders are not added to PATH so a Windows npm or php never shadows the ones in the distro.
[boot]
systemd=true

[user]
default=larakube

[interop]
enabled=true
appendWindowsPath=false

# Store Linux permissions on Windows drives, so a key shared from the host
# (C:\Users\<you>\.ssh, used by project deploys run in here) can be made
# 0600 and OpenSSH accepts it straight from /mnt/c. Windows' own OpenSSH
# ignores these bits.
[automount]
options = "metadata,umask=022,fmask=011"
